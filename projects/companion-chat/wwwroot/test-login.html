<!DOCTYPE html>
<html>
<head>
    <title>登录测试</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f5f5f5; }
        .test-box { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        button { background: #0078d4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
        button:hover { background: #106ebe; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="test-box">
        <h1>🔍 登录功能诊断</h1>
        <p>点击下面的按钮测试登录功能：</p>
        
        <button onclick="testClick()">测试1: 按钮点击</button>
        <button onclick="testFetch()">测试2: API调用</button>
        <button onclick="testLogin()">测试3: 完整登录</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const result = document.getElementById('result');
            const color = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            result.innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            console.log(message);
        }

        function testClick() {
            log('✅ 按钮点击事件正常！onclick可以触发', 'success');
        }

        async function testFetch() {
            log('开始测试 API 连接...', 'info');
            try {
                const res = await fetch('/api/login', { method: 'POST' });
                log(`API响应状态: ${res.status}`, 'info');
                const data = await res.json();
                log('API响应数据: ' + JSON.stringify(data), 'success');
            } catch (e) {
                log('❌ API调用失败: ' + e.message, 'error');
            }
        }

        async function testLogin() {
            log('开始完整登录测试...', 'info');
            try {
                log('1. 发送登录请求...', 'info');
                const res = await fetch('/api/login', { method: 'POST' });
                log(`2. 收到响应: ${res.status}`, 'info');
                
                const data = await res.json();
                log('3. 解析数据: ' + JSON.stringify(data), 'info');
                
                if (data.success) {
                    log('✅ 登录成功！', 'success');
                } else {
                    log('❌ 登录失败: ' + data.message, 'error');
                }
            } catch (e) {
                log('❌ 错误: ' + e.message, 'error');
                log('详细错误: ' + e.stack, 'error');
            }
        }

        // 页面加载时的检查
        window.addEventListener('load', () => {
            log('🚀 页面已加载', 'success');
            log('当前URL: ' + window.location.href, 'info');
        });
    </script>
</body>
</html>
